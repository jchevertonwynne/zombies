[package]
name = "zombies"
version = "0.1.0"
edition = "2024"

[dependencies]
avian3d = "0.8"
bevy = { version = "0.20", features = ["wav"] }
rand = "0.10.3"

[features]
# Faster incremental builds while iterating: `cargo run --features dev`
dev = ["bevy/dynamic_linking"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[package]
name = "zombies"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
avian3d = "0.8"
bytes = "1"
bevy = { version = "0.20", features = ["serialize"] }
# avian's own interpolation, named directly only to cut a teleport cleanly (see `Teleport`).
bevy_transform_interpolation = "0.6"
iroh = "1"
pathfinding = "4"
postcard = { version = "1", default-features = false, features = ["use-std"] }
rand = "0.10.3"
# The lobby is asked over HTTPS; iroh brings the TLS, `rustls` is named to pick its provider.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

[dev-dependencies]
# Reads `assets/manifest.json` in the provenance check.
serde_json = "1"

[features]
# Faster incremental builds while iterating: `cargo run --features dev`
dev = ["bevy/dynamic_linking"]

[profile.dev]
opt-level = 1
# The mingw linker embeds DWARF debuginfo directly in the .exe, unlike MSVC which
# writes a separate .pdb. With full debuginfo this binary hit 2.45 GB, past the
# 2 GB PE limit, and exec failed with EINVAL before Windows could load it.
# Line tables keep file/line numbers in panic backtraces at a fraction of the size.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[workspace]
members = ["tools/gen-sounds", "tools/texpack"]
